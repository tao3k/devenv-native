[package]
name = "xiuxian-ast"
version.workspace = true
edition.workspace = true
description = "Unified AST utilities using ast-grep"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
# ast-grep - AST pattern matching (unified version)
ast-grep-core = { workspace = true }
ast-grep-language = { workspace = true }
ast-grep-config = { workspace = true }

# Common utilities
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }

# File traversal
walkdir = { workspace = true }
xiuxian-io = { path = "../xiuxian-io" }
xiuxian-testing = { path = "../xiuxian-testing" }
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
