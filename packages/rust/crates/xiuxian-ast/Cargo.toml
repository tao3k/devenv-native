[package]
name = "xiuxian-ast"
version.workspace = true
edition.workspace = true
description = "Unified AST utilities using ast-grep"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
# ast-grep - AST pattern matching (unified version)
ast-grep-core = { workspace = true }
ast-grep-language = { workspace = true }
ast-grep-config = { workspace = true }

# Common utilities
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
blake3 = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
