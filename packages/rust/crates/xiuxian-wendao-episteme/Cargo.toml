[package]
name = "xiuxian-wendao-episteme"
version.workspace = true
edition.workspace = true
description = "Rust-owned Episteme source-contract runtime boundary for Wendao"
authors.workspace = true
license.workspace = true
publish = false

[features]
foyer-artifact-cache = ["dep:xiuxian-db-store", "xiuxian-db-store/foyer-artifact-cache"]

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
clap = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
quick-xml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers" }

[lints]
workspace = true

[[bin]]
name = "wendao-episteme"
path = "src/bin/wendao_episteme.rs"

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
xiuxian-qianji-control = { path = "../xiuxian-qianji-control" }
