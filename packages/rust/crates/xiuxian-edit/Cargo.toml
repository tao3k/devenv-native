[package]
name = "xiuxian-edit"
version.workspace = true
edition.workspace = true

[dependencies]
# The Surgeon - Structural refactoring
# Using xiuxian-ast for unified ast-grep (v0.40.5)
xiuxian-ast = { path = "../xiuxian-ast" }

# Diff generation for preview
similar = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
xiuxian-io = { path = "../xiuxian-io" }
xiuxian-testing = { path = "../xiuxian-testing" }

# The Ouroboros - Heavy-duty batch refactoring
rayon = { workspace = true } # Parallel iteration
ignore = { workspace = true } # .gitignore-aware file traversal

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
