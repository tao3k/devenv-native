[package]
name = "xiuxian-wendao-attachments"
version.workspace = true
edition.workspace = true
description = "Attachment parsing, audit, and artifact helpers for Wendao document surfaces"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
foyer-artifact-cache = [
  "dep:xiuxian-db-store",
  "xiuxian-db-store/arrow-codec",
  "xiuxian-db-store/foyer-artifact-cache",
  "xiuxian-db-store/artisan-state",
]
audio-shard-arrow = [
  "dep:arrow",
  "dep:xiuxian-db-store",
  "xiuxian-db-store/arrow-codec",
]
archive-audit = [
  "dep:flate2",
  "dep:tar",
]
image-shards = [
  "dep:image",
]
legacy-office = [
  "dep:litchi",
]
pdf-source-range = [
  "dep:arrow",
  "dep:xiuxian-db-store",
  "xiuxian-db-store/arrow-codec",
  "xiuxian-db-store/artisan-state",
  "dep:lopdf",
  "dep:num-traits",
]
pdf-render = [
  "foyer-artifact-cache",
  "pdf-source-range",
  "dep:image",
  "dep:pdfium-render",
]

[dependencies]
arrow = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
litchi = { git = "https://github.com/DevExzh/litchi.git", rev = "f9ca012b7240e83f62c3fec239a2870cd6c82294", default-features = false, features = ["ole", "ooxml"], optional = true }
lopdf = { git = "https://github.com/J-F-Liu/lopdf", rev = "7a05512d831415b1f2b1ce522391d6beab8a1284", optional = true }
num-traits = { workspace = true, optional = true }
pdfium-render = { version = "0.9.0", optional = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true, optional = true }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }
xiuxian-polyglot-orchestrator = { path = "../xiuxian-polyglot-orchestrator" }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
orgize = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
