[package]
name = "xiuxian-wendao-attachments"
version.workspace = true
edition.workspace = true
description = "Attachment parsing, audit, and artifact helpers for Wendao document surfaces"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
archive-audit = [
  "dep:flate2",
  "dep:tar",
]
pdf-source-range = [
  "dep:arrow",
  "dep:lopdf",
  "dep:num-traits",
]
pdf-render = [
  "pdf-source-range",
  "dep:image",
  "dep:pdfium-render",
]

[dependencies]
arrow = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
lopdf = { git = "https://github.com/J-F-Liu/lopdf", rev = "7a05512d831415b1f2b1ce522391d6beab8a1284", optional = true }
num-traits = { workspace = true, optional = true }
pdfium-render = { version = "0.9.0", optional = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true, optional = true }
xiuxian-polyglot-orchestrator = { path = "../xiuxian-polyglot-orchestrator" }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
