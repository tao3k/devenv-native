[package]
name = "xiuxian-wendao-web"
version.workspace = true
edition.workspace = true
description = "Web and gateway namespace boundary for Wendao"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
studio = [
  "dep:xiuxian-wendao",
  "xiuxian-wendao/duckdb",
  "xiuxian-wendao/studio",
  "xiuxian-wendao/zhenfa-router",
]

[dependencies]
xiuxian-wendao = { path = "../xiuxian-wendao", default-features = false, optional = true }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", default-features = false }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }

[lints]
workspace = true
