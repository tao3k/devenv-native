[package]
name = "xiuxian-db-store"
version.workspace = true
edition.workspace = true
description = "Bounded database storage facade for Lance and lightweight client stores"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = []
artifact-cache = []
foyer-artifact-cache = ["artifact-cache", "dep:foyer", "dep:tokio"]
engine = [
  "dep:arrow",
  "dep:arrow-ipc",
  "dep:datafusion",
  "dep:parquet",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
]
vector-store = ["engine", "dep:xiuxian-vector", "xiuxian-vector/vector-store"]
duckdb-types = ["dep:serde"]
duckdb = ["duckdb-types", "dep:duckdb"]
qianji-bpmn-workflow-state = [
  "duckdb",
  "dep:qianji-bpmn-engine",
  "dep:serde_json",
  "dep:thiserror",
]

[dependencies]
arrow = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
foyer = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
qianji-bpmn-engine = { path = "../qianji-bpmn-engine", default-features = false, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
xiuxian-vector = { path = "../xiuxian-vector", default-features = false, optional = true }

[dev-dependencies]
criterion = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "db_store_performance"
harness = false

[lints]
workspace = true
