[package]
name = "xiuxian-wendao-runtime"
version.workspace = true
edition.workspace = true
description = "Runtime-owned host behavior for xiuxian-wendao extraction"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = []
duckdb-config = [
    "dep:xiuxian-db-store",
    "xiuxian-db-store/duckdb-types",
]
transport = [
    "dep:arrow-array",
    "dep:arrow-flight",
    "dep:arrow-schema",
    "dep:async-trait",
    "dep:datafusion",
    "dep:futures",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
    "xiuxian-wendao-core/arrow-transport",
    "xiuxian-db-store/engine",
]
vector-store = ["transport", "xiuxian-db-store/vector-store"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
arrow-flight = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
include_dir = { workspace = true }
async-trait = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers", default-features = false }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "mock_flight_exchange_server"
required-features = ["transport"]

[lints]
workspace = true
