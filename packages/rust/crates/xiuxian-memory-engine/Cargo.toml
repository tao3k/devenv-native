[package]
name = "xiuxian-memory-engine"
version.workspace = true
edition.workspace = true
description = "Self-evolving memory engine with Q-Learning and Two-Phase Search"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
# Note: LanceDB persistence is deferred due to API changes in newer LanceDB versions.
# Use JSON persistence instead. Re-add when ready to upgrade.
# lance = { workspace = true }
# lance-arrow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
num-traits = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Reuse common types
xiuxian-types = { path = "../xiuxian-types" }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, features = ["project-state"] }

# Vector operations for embedding similarity (using our own simple implementation)
# lance-linalg = { workspace = true } # Deferred

# Logging
log = { workspace = true }
redis = { workspace = true, optional = true }

[features]
default = []
valkey = ["dep:redis"]
# lance = []  # Reserved for future LanceDB upgrade

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
