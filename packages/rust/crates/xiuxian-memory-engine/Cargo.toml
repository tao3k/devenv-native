[package]
name = "xiuxian-memory-engine"
version.workspace = true
edition.workspace = true
description = "Self-evolving memory engine with Q-Learning and Two-Phase Search"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
# Note: LanceDB persistence is deferred due to API changes in newer LanceDB versions.
# Use JSON persistence instead. Re-add when ready to upgrade.
# lance = { workspace = true }
# lance-arrow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
uuid = { workspace = true }
num-traits = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Reuse common types
xiuxian-types = { path = "../xiuxian-types" }
xiuxian-testing = { path = "../xiuxian-testing" }

# Vector operations for embedding similarity (using our own simple implementation)
# lance-linalg = "2.0"  # Deferred

# Logging
log = { workspace = true }
redis = { workspace = true, optional = true }

# Python bindings
pyo3 = { workspace = true, optional = true }

[features]
default = []
pybindings = ["pyo3"]
valkey = ["dep:redis"]
# lance = []  # Reserved for future LanceDB upgrade

[dev-dependencies]
xiuxian-io = { path = "../xiuxian-io" }
tempfile = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
