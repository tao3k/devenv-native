[package]
name = "xiuxian-wendao-sql"
version.workspace = true
edition.workspace = true
description = "Bounded SQL helper surfaces shared across Wendao downstream consumers"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
duckdb = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlparser = { workspace = true }
tokio = { workspace = true }
walkdir = { workspace = true }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, features = ["arrow-codec"] }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers", default-features = false }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[dev-dependencies]
parquet = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
