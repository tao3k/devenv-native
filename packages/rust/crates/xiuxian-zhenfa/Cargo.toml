[package]
name = "xiuxian-zhenfa"
version.workspace = true
edition.workspace = true
description = "Zhenfa (Matrix Gateway) - Contract and streaming gateway with optional JSON-RPC support"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = [
  "client",
  "contract-validation",
  "gateway",
  "streaming",
  "xml-transform",
]
native = []
client = [
  "dep:reqwest",
]
gateway = [
  "dep:axum",
  "dep:reqwest",
]
contract-validation = [
  "dep:quick-xml",
  "dep:tempfile",
]
streaming = []
xml-transform = ["dep:pulldown-cmark"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true, optional = true }
uuid = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[lib]
name = "xiuxian_zhenfa"
path = "src/lib.rs"
