[package]
name = "xiuxian-io"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
memchr = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
# Parallel iteration
rayon = { workspace = true }
tera = { workspace = true }
serde_json = { workspace = true }
xiuxian-tokenizer = { path = "../xiuxian-tokenizer" }
# Event Bus for reactive file watching (optional)
xiuxian-event = { path = "../xiuxian-event", optional = true }
xiuxian-testing = { path = "../xiuxian-testing" }
# File watching crate (optional, requires notify feature)
notify = { workspace = true, features = ["serde"], optional = true }
# Glob pattern matching (optional, for notify feature)
globset = { workspace = true, optional = true }

[features]
default = []
assembler = []  # Enable context assembly functionality
notify = ["xiuxian-event", "dep:notify", "dep:globset"]  # Enable file watching with event publishing

[dev-dependencies]
tempfile = { workspace = true }
