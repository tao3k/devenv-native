[package]
name = "xiuxian-qianji-bpmn-engine"
version.workspace = true
edition.workspace = true
description = "Standalone BPMN engine scaffold for Qianji runtime integration"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["valkey"]
valkey = ["dep:redis", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
md5 = { workspace = true }
quick-xml = { workspace = true }
rayon = { workspace = true }
redis = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"], optional = true }

[dev-dependencies]
anyhow = { workspace = true }
insta = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[lints]
workspace = true
