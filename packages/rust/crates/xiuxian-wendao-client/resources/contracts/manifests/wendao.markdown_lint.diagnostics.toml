id = "wendao.markdown_lint.diagnostics"
version = 1
task_types = ["cli_call", "diagnostic_render"]

[cli]
argv = ["wendao", "lint", "markdown"]
positionals = ["paths"]

[cli.flags]
output = "--output"
root = "--root"
skip_dirs = "--skip-dir"

[output]
format = "markdown_lint_report"
schema_provider = "MarkdownLintReport"

[[params]]
name = "paths"
type = "string_array"

[[params]]
name = "root"
type = "string"
default = "."

[[params]]
name = "output"
type = "string"
default = "text"

[[params]]
name = "skip_dirs"
type = "string_array"

[[rules]]
code = "invalid_utf8"
problem = "Markdown file is not valid UTF-8."
detail_strategy = "utf8_error_message"
expected = "Encode the file as UTF-8 before linting it."

[[rules]]
code = "missing_frontmatter"
problem = "Document-level YAML frontmatter is required."
detail_strategy = "parser_message"
expected = "Add a leading `--- ... ---` block with the document identity field required by this surface before the document body begins."

[[rules]]
code = "missing_frontmatter_title"
problem = "Ordinary document frontmatter must include a non-empty `title`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `title` field in the document frontmatter."

[[rules]]
code = "missing_frontmatter_kind"
problem = "Common frontmatter must include a non-empty `kind`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `kind` field in the document frontmatter."

[[rules]]
code = "missing_frontmatter_category"
problem = "Common frontmatter must include a non-empty `category`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `category` field in the document frontmatter."

[[rules]]
code = "missing_frontmatter_tags"
problem = "Common frontmatter must include a non-empty `tags` array."
detail_strategy = "parser_message"
expected = "Set top-level `tags` to a non-empty YAML array of strings."

[[rules]]
code = "missing_frontmatter_description"
problem = "Common frontmatter must include a non-empty `description`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `description` field in the document frontmatter."

[[rules]]
code = "missing_frontmatter_author"
problem = "Common frontmatter must include a non-empty `author`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `author` field in the document frontmatter."

[[rules]]
code = "missing_frontmatter_date"
problem = "Common frontmatter must include a minute-precision `date`."
detail_strategy = "parser_message"
expected = "Set top-level `date` to `YYYY-MM-DDTHH:MM±HH:MM` or `YYYY-MM-DDTHH:MMZ`."

[[rules]]
code = "invalid_frontmatter_date_precision"
problem = "Common frontmatter `date` must be precise to the minute."
detail_strategy = "parser_message"
expected = "Use `YYYY-MM-DDTHH:MM±HH:MM` or `YYYY-MM-DDTHH:MMZ`; omit seconds."

[[rules]]
code = "missing_frontmatter_retrieval_saliency_base"
problem = "Common frontmatter must include numeric top-level `saliency_base`."
detail_strategy = "parser_message"
expected = "Set top-level `saliency_base` to a number."

[[rules]]
code = "missing_frontmatter_retrieval_decay_rate"
problem = "Common frontmatter must include numeric top-level `decay_rate`."
detail_strategy = "parser_message"
expected = "Set top-level `decay_rate` to a number."

[[rules]]
code = "missing_skill_frontmatter_name"
problem = "Skill-shaped document frontmatter must include a non-empty top-level `name`."
detail_strategy = "parser_message"
expected = "Set a non-empty top-level `name` field in the SKILL frontmatter."

[[rules]]
code = "missing_skill_frontmatter_metadata"
problem = "Skill-shaped document frontmatter must contain a top-level `metadata` mapping."
detail_strategy = "parser_message"
expected = "Add a top-level `metadata:` mapping to the SKILL frontmatter."

[[rules]]
code = "invalid_skill_frontmatter_schema"
problem = "Skill-shaped document frontmatter must satisfy the parser-owned SKILL.md schema."
detail_strategy = "parser_message"
expected = "Start from common frontmatter, then add top-level `type: skill`, `name`, `metadata.version`, `metadata.source`, and a non-empty `metadata.routing_keywords` array."

[[rules]]
code = "unclosed_frontmatter"
problem = "YAML frontmatter opens but never closes."
detail_strategy = "parser_message"
found = "---"
expected = "Close the frontmatter with `---` or `...` before the document body begins."

[[rules]]
code = "invalid_frontmatter_yaml"
problem = "YAML frontmatter is syntactically invalid."
detail_strategy = "parser_message"
found_strategy = "source_line"
expected = "Keep valid YAML between the opening and closing frontmatter fences."

[[rules]]
code = "unclosed_fence"
problem = "Fenced code block opens but never closes."
detail_strategy = "parser_message"
found_strategy = "source_line"
expected = "Add a closing fence with the same marker type and at least the same width."

[[rules]]
code = "bare_obsidian_wikilink"
problem = "Obsidian officially allows bare wikilinks, but repository authoring policy requires an explicit display label."
detail = "Keep the official Obsidian target, but add a descriptive display label for repository and LLM-facing authoring."
found_strategy = "link_literal"
expected_strategy = "rewrite_with_markdown"
tip_strategy = "display_label_tip"

[[rules]]
code = "redundant_obsidian_label"
problem_strategy = "redundant_label_problem"
detail = "The explicit label should add human-readable namespace meaning instead of echoing the raw path or heading."
found_strategy = "link_literal"
expected_strategy = "rewrite_with_markdown"
tip_strategy = "display_label_tip"

[[rules]]
code = "mixed_wikilink_markdown_link"
problem = "Wikilink brackets and Markdown link parentheses are mixed into one invalid link under Obsidian official syntax."
detail = "Choose either official Obsidian wikilink syntax or standard Markdown link syntax."
found_strategy = "link_literal"
expected_strategy = "rewrite_with_markdown"
tip_strategy = "display_label_tip"

[[rules]]
code = "non_canonical_obsidian_alias_order"
problem = "The right-hand wikilink segment looks like a repository target path or address, so target and display label appear reversed."
detail = "This is legal Obsidian wikilink syntax, but repository authoring policy only flags reversed alias order when the right side looks like a path, heading address, block address, or Markdown note target."
found_strategy = "link_literal"
expected_strategy = "rewrite_wikilink_only"
tip_strategy = "display_label_tip"

[[rules]]
code = "missing_local_target"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "link_literal"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"

[[rules]]
code = "missing_local_fragment"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "link_literal"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"

[[rules]]
code = "local_target_transient_dir"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "link_literal"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"

[[rules]]
code = "local_target_outside_root"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "link_literal"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"

[[rules]]
code = "directory_link_style_mismatch"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "dynamic_found_text"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"

[[rules]]
code = "directory_link_style_ambiguous"
problem_strategy = "dynamic_problem_text"
detail_strategy = "dynamic_detail_text"
found_strategy = "dynamic_found_text"
expected_strategy = "dynamic_expected_text"
tip_strategy = "dynamic_tip_text"
