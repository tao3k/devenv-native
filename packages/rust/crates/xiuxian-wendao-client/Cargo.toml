[package]
name = "xiuxian-wendao-client"
version.workspace = true
edition.workspace = true
description = "Lightweight Wendao client CLI for local document tooling"
authors.workspace = true
license.workspace = true
publish = false
default-run = "wendao-client"

[features]
default = ["orgize-agent-read-model"]
orgize-agent-read-model = [
  "dep:xiuxian-db-store",
  "dep:xiuxian-graph-core",
  "dep:xiuxian-memory-engine",
  "xiuxian-db-store/duckdb",
  "xiuxian-db-store/project-state",
  "xiuxian-graph-core/mermaid",
]
performance = []
semantic-sql = ["dep:tokio", "dep:xiuxian-wendao-sql"]

[[bin]]
name = "wendao-client"
path = "src/bin/wendao.rs"

[dependencies]
anyhow = { workspace = true }
ariadne = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, optional = true }
walkdir = { workspace = true }
rayon = { workspace = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }
xiuxian-graph-core = { path = "../xiuxian-graph-core", default-features = false, optional = true }
xiuxian-logging = { path = "../xiuxian-logging" }
xiuxian-memory-engine = { path = "../xiuxian-memory-engine", optional = true }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers", default-features = false }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql", optional = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "wendao_client_get"
harness = false
required-features = ["performance"]

[[bench]]
name = "wendao_client_orgize"
harness = false
required-features = ["performance", "orgize-agent-read-model"]

[lints]
workspace = true
