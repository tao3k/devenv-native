[package]
name = "xiuxian-wendao-client"
version.workspace = true
edition.workspace = true
description = "Lightweight Wendao client CLI for local document tooling"
authors.workspace = true
license.workspace = true
publish = false
default-run = "wendao-client"

[features]
performance = []

[[bin]]
name = "wendao-client"
path = "src/bin/wendao.rs"

[dependencies]
anyhow = { workspace = true }
ariadne = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
walkdir = { workspace = true }
rayon = { workspace = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-logging = { path = "../xiuxian-logging" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers" }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql" }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "wendao_client_get"
harness = false
required-features = ["performance"]

[lints]
workspace = true
