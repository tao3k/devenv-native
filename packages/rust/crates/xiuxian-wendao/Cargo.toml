[package]
name = "xiuxian-wendao"
version.workspace = true
edition.workspace = true
description = "High-performance knowledge and link-graph runtime with Valkey-first storage"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false
default-run = "wendao"

[features]
default = [
  "builtin-plugins",
  "zhenfa-router",
  "julia",
  "search-runtime",
  "studio",
  "vector-store",
]
pybindings = ["dep:pyo3", "repo-lexical-index"]
repo-lexical-index = ["dep:tantivy"]
zhenfa-router = [
  "dep:axum",
  "dep:notify",
  "dep:notify-debouncer-full",
  "dep:reqwest",
  "dep:tower",
  "dep:xiuxian-ast",
  "dep:xiuxian-zhenfa",
  "search-runtime",
]
julia = [
  "dep:xiuxian-wendao-julia",
]
builtin-plugins = ["dep:xiuxian-wendao-builtin"]
runtime-transport = ["xiuxian-wendao-runtime/transport"]
vector-store = ["dep:arrow", "dep:reqwest", "dep:xiuxian-vector-store"]
search-runtime = [
  "dep:graphql-parser",
  "dep:xiuxian-ast",
  "dep:xiuxian-vector",
  "vector-store",
  "runtime-transport",
  "dep:arrow-flight",
  "dep:datafusion",
  "dep:parquet",
  "dep:tonic",
  "dep:tonic-web",
]
studio = [
  "search-runtime",
  "repo-lexical-index",
  "dep:xiuxian-ast",
  "dep:xiuxian-zhenfa",
]
performance = ["xiuxian-testing/performance"]
performance-stress = ["performance"]
duckdb = ["dep:duckdb"]

[[bin]]
name = "wendao"
path = "src/bin/wendao.rs"
required-features = ["studio", "zhenfa-router"]

[[bin]]
name = "export_types"
path = "src/bin/export_types.rs"
required-features = ["studio"]

[[bin]]
name = "wendao_search_flight_server"
path = "src/bin/wendao_search_flight_server.rs"
required-features = ["studio", "zhenfa-router"]

[[bin]]
name = "wendao_search_flightsql_server"
path = "src/bin/wendao_search_flightsql_server.rs"
required-features = ["studio", "julia"]

[[bin]]
name = "wendao_search_seed_sample"
path = "src/bin/wendao_search_seed_sample.rs"
required-features = ["studio", "julia"]

[[bench]]
name = "wendao_performance"
harness = false
required-features = ["performance"]


[dependencies]

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
toml = "0.8"
chrono = { workspace = true, features = ["clock", "serde"] }
uuid = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
prost = "0.14"

# Path resolution
dirs = "5"
walkdir = "2"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Reuse common types
xiuxian-types = { path = "../xiuxian-types" }
xiuxian-skills = { path = "../xiuxian-skills" }
xiuxian-logging = { path = "../xiuxian-logging" }
xiuxian-vector = { path = "../xiuxian-vector", default-features = false, optional = true }
xiuxian-vector-store = { path = "../xiuxian-vector-store", optional = true }
xiuxian-io = { path = "../xiuxian-io" }
xiuxian-git-repo = { path = "../xiuxian-git-repo" }
xiuxian-llm = { path = "../xiuxian-llm" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers" }
xiuxian-wendao-builtin = { path = "../xiuxian-wendao-builtin", default-features = false, optional = true }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
xiuxian-wendao-julia = { path = "../xiuxian-wendao-julia", optional = true }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", default-features = false }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql" }
xiuxian-ast = { path = "../xiuxian-ast", optional = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-testing = { path = "../xiuxian-testing" }

# Macro utilities
xiuxian-macros = { path = "../xiuxian-macros" }

# Optional Python bindings
pyo3 = { workspace = true, optional = true }

# Fast hash for sync (5-10x faster than MD5)
xxhash-rust = "0.8"

# Content fingerprinting (Blake3)
blake3 = "1"

# SHA-256 for surgical fix verification (Blueprint v3.0)
sha1 = "0.10"

# Fast regex for entity reference extraction (10-100x faster than Python)
regex = "1"
globset = { workspace = true }
comrak = { workspace = true }
include_dir = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
dashmap = "7.0.0-rc2"

# Parallel processing
rayon = "1.11"

# Unicode normalization for entity deduplication
unicode-normalization = "0.1"

arrow = { workspace = true, optional = true }
arrow-flight = { workspace = true, features = ["flight-sql"], optional = true }
datafusion = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
tonic = { version = "0.14.5", default-features = false, features = ["transport"], optional = true }
tonic-web = { version = "0.14", optional = true }

# Graph algorithms
petgraph = { workspace = true }

# Logging
log = { workspace = true }
clap = { workspace = true }
redis = { version = "1.0.3", default-features = false, features = ["tokio-comp"] }
axum = { workspace = true, optional = true }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"], optional = true }
xiuxian-zhenfa = { path = "../xiuxian-zhenfa", optional = true }
url = "2.5.7"

# Real-time observation (Project Sentinel Phase 2)
notify = { version = "8.2.0", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }

# HTTP client for webhook notifications (Phase 7 ForwardNotifier)
reqwest = { workspace = true, optional = true }
tantivy = { version = "0.25", optional = true }
graphql-parser = { version = "0.4", optional = true }
duckdb = { version = "=1.10501.0", default-features = false, features = ["bundled", "appender-arrow"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
insta = { workspace = true }
serial_test = { version = "3", features = ["file_locks"] }
criterion = { version = "0.5", features = ["html_reports"] }

[lints]
workspace = true
