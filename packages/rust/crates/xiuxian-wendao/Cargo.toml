[package]
name = "xiuxian-wendao"
version.workspace = true
edition.workspace = true
description = "High-performance knowledge and link-graph runtime with local DuckDB cache and shared Valkey storage"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = [
  "builtin-plugins",
  "duckdb",
  "zhenfa-router",
  "julia",
  "repo-lexical-index",
  "search-runtime",
]
pybindings = ["dep:pyo3", "repo-lexical-index"]
repo-lexical-index = ["dep:tantivy"]
zhenfa-router = [
  "dep:axum",
  "dep:notify",
  "dep:notify-debouncer-full",
  "dep:reqwest",
  "dep:tower",
  "dep:xiuxian-ast",
  "xiuxian-wendao-parsers/ast-validation",
  "dep:xiuxian-zhenfa",
  "xiuxian-zhenfa/gateway",
  "search-runtime",
]
julia = [
  "dep:xiuxian-julia-core",
  "dep:xiuxian-julia-runtime",
  "dep:xiuxian-polyglot-orchestrator",
]
builtin-plugins = ["dep:xiuxian-wendao-builtin"]
runtime-transport = [
  "xiuxian-wendao-core/arrow-transport",
  "xiuxian-wendao-runtime/transport",
]
vector-store = [
  "dep:reqwest",
  "xiuxian-db-store/vector-store",
  "xiuxian-wendao-runtime/vector-store",
]
search-runtime = [
  "repo-lexical-index",
  "dep:graphql-parser",
  "dep:xiuxian-ast",
  "dep:xiuxian-code-intelligence",
  "xiuxian-wendao-parsers/ast-validation",
  "xiuxian-db-store/arrow-codec",
  "xiuxian-db-store/engine",
  "runtime-transport",
  "xiuxian-wendao-core/arrow-transport",
  "xiuxian-wendao-runtime/duckdb-config",
  "dep:arrow-flight",
  "dep:datafusion",
  "dep:parquet",
  "dep:tonic",
  "dep:tonic-web",
]
studio = [
  "search-runtime",
  "repo-lexical-index",
  "dep:xiuxian-ast",
  "xiuxian-wendao-parsers/ast-validation",
  "dep:xiuxian-zhenfa",
  "xiuxian-zhenfa/native",
]
performance = []
performance-stress = ["performance"]
test-support = [
  "builtin-plugins",
  "repo-lexical-index",
  "search-runtime",
  "studio",
]
duckdb-test-support = [
  "test-support",
  "duckdb",
]
document-extract-attachment-audit = [
  "dep:xiuxian-wendao-attachments",
  "xiuxian-wendao-attachments/archive-audit",
]
document-extract-pdf-source-range = [
  "dep:xiuxian-wendao-attachments",
  "xiuxian-wendao-attachments/pdf-source-range",
]
document-extract-pdf-render = [
  "document-extract-pdf-source-range",
  "xiuxian-wendao-attachments/pdf-render",
]
duckdb = [
  "dep:duckdb",
  "xiuxian-db-store/arrow-codec",
  "xiuxian-db-store/duckdb",
  "xiuxian-wendao-runtime/duckdb-config",
  "xiuxian-wendao-sql/duckdb",
]

[[bench]]
name = "wendao_performance"
harness = false
required-features = ["performance"]

[[bin]]
name = "wendao_repo_search_flight_server"
required-features = ["search-runtime", "duckdb"]


[dependencies]

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "fs"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
uuid = { workspace = true }
specta = { workspace = true }
prost = { workspace = true }

walkdir = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

xiuxian-logging = { path = "../xiuxian-logging" }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, features = ["arrow-codec"] }
xiuxian-io = { path = "../xiuxian-io" }
xiuxian-git-repo = { path = "../xiuxian-git-repo" }
xiuxian-llm = { path = "../xiuxian-llm" }
xiuxian-wendao-episteme = { path = "../xiuxian-wendao-episteme" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers", default-features = false }
xiuxian-wendao-client = { path = "../xiuxian-wendao-client", default-features = false }
xiuxian-wendao-builtin = { path = "../xiuxian-wendao-builtin", default-features = false, optional = true }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
xiuxian-wendao-attachments = { path = "../xiuxian-wendao-attachments", optional = true }
xiuxian-julia-core = { path = "../xiuxian-julia-core", optional = true }
xiuxian-julia-runtime = { path = "../xiuxian-julia-runtime", features = ["wendao"], optional = true }
xiuxian-polyglot-orchestrator = { path = "../xiuxian-polyglot-orchestrator", features = ["julia-runtime", "wendao-contracts"], optional = true }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", default-features = false }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql", default-features = false }
xiuxian-ast = { path = "../xiuxian-ast", optional = true }
xiuxian-code-intelligence = { path = "../xiuxian-code-intelligence", optional = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }

# Macro utilities
xiuxian-macros = { path = "../xiuxian-macros" }

# Optional Python bindings
pyo3 = { workspace = true, optional = true }

# Fast hash for sync (5-10x faster than MD5)
xxhash-rust = { workspace = true }

# Content fingerprinting (Blake3)
blake3 = { workspace = true }

# Opaque doc IDs use a SHA-256 digest truncated to the 40-char protocol shape.
sha2 = { workspace = true }

# Fast regex for entity reference extraction (10-100x faster than Python)
regex = { workspace = true }
globset = { workspace = true }
comrak = { workspace = true }
include_dir = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Parallel processing
rayon = { workspace = true }

# Unicode normalization for entity deduplication
unicode-normalization = { workspace = true }

arrow = { workspace = true }
arrow-flight = { workspace = true, features = ["flight-sql"], optional = true }
datafusion = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }

# Graph algorithms
petgraph = { workspace = true }

# Logging
log = { workspace = true }
clap = { workspace = true }
redis = { workspace = true, features = ["tokio-comp"] }
axum = { workspace = true, optional = true }
tower = { workspace = true, features = ["limit", "load-shed", "timeout", "util"], optional = true }
xiuxian-zhenfa = { path = "../xiuxian-zhenfa", default-features = false, optional = true }
url = { workspace = true }

# Real-time observation (Project Sentinel Phase 2)
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

# HTTP client for webhook notifications (Phase 7 ForwardNotifier)
reqwest = { workspace = true, optional = true }
tantivy = { version = "0.25", optional = true }
graphql-parser = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
insta = { workspace = true }
rust-lang-project-harness = { workspace = true }
serial_test = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true
