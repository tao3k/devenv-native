# =============================================================================
# Wendao (LinkGraph Engine) Configuration
# =============================================================================
#
# Local overlays should import this file from a wrapper such as
# `wendao.studio.overlay.toml` instead of rewriting the base config in place.

[link_graph]
# Primary graph backend (Wendao Rust engine).
backend = "wendao"
# Default backend config location relative to notebook root.
config_relative_path = ".wendao/config.toml"

# File patterns watched for LinkGraph refresh triggers.
watch_patterns = ["**/*.md", "**/*.markdown", "**/*.mdx", "**/SKILL.md"]

# Optional relative whitelist. If non-empty, only these paths are indexed.
include_dirs = []

# When include_dirs is empty, auto-select existing directories from
# include_dirs_auto_candidates.
include_dirs_auto = true
include_dirs_auto_candidates = ["assets/knowledge", "docs", ".data/harvested", ".data/research/papers"]

# Additional directory excludes (non-hidden).
exclude_dirs = ["target", "node_modules"]

# Cross-process stats cache TTL (seconds).
stats_persistent_cache_ttl_sec = 120.0

# Response-time stats probe budget (seconds).
stats_response_probe_timeout_sec = 0.05
stats_response_refresh_timeout_sec = 5.0

# Graph-first retrieval policy runtime knobs.
[link_graph.retrieval]
mode = "hybrid"
candidate_multiplier = 4
max_sources = 8
hybrid_min_hits = 2
hybrid_min_top_score = 0.25
graph_rows_per_source = 8

[link_graph.retrieval.semantic_ignition]
backend = "disabled"
# vector_store_path = ".cache/wendao/vector-store"
# table_name = "wendao_semantic_docs"
# embedding_base_url = "http://127.0.0.1:11434"
# embedding_model = "glm-5"

[link_graph.cache]
valkey_url = "redis://localhost:6379/0"
key_prefix = "xiuxian_wendao:link_graph:index"
ttl_seconds = 300

# Optional repo-analysis cache backend. Leave unset to disable the Valkey-backed
# analyzer cache and fall back to in-process behavior.
#
# [analyzers.cache]
# valkey_url = "redis://127.0.0.1:6379/0"
# key_prefix = "xiuxian_wendao:repo_analysis"
# ttl_seconds = 3600

# Optional graph snapshot persistence backend used by `KnowledgeGraph`
# save/load helpers. Leave unset when graph persistence should stay disabled.
#
# [graph.persistence]
# valkey_url = "redis://127.0.0.1:6379/0"
# key_prefix = "xiuxian_wendao:graph"

# Optional knowledge-entry storage endpoint. When unset, Wendao storage keeps
# its existing localhost fallback.
#
# [storage.knowledge]
# valkey_url = "redis://127.0.0.1/"

# Optional gateway runtime knobs. Leave unset to keep machine/default plus env
# fallback behavior.
#
# [gateway.runtime]
# listen_backlog = 2048
# studio_concurrency_limit = 64
# studio_request_timeout_secs = 15

# Bounded DuckDB runtime for published Parquet search reads.
#
# This is the local query-execution layer for published Parquet search data. It
# is not related to `xiuxian-memory-engine`, episodic memory, or durable memory
# promotion. Leave `database_path` and `temp_directory` unset here so the
# runtime-owned defaults stay under `$PRJ_DATA_HOME/xiuxian-wendao`; gateway
# deployments may override them through the root `wendao.toml`.
[search.duckdb]
enabled = true
preserve_insertion_order = true
parquet_metadata_cache = false

[link_graph.related_ppr]
max_candidates = 4096
max_partitions = 8
time_budget_ms = 250.0

[link_graph.agentic.suggested_link]
max_entries = 2000
ttl_seconds = 0

[link_graph.agentic.search]
include_provisional_default = false
provisional_limit = 50

[link_graph.agentic.expansion]
max_workers = 4
max_candidates = 256
max_pairs_per_worker = 128
time_budget_ms = 250.0

[link_graph.agentic.execution]
worker_time_budget_ms = 120.0
persist_suggestions_default = false
persist_retry_attempts = 2
idempotency_scan_limit = 2000
relation = "related_to"
agent_id = "qianhuan-architect"
evidence_prefix = "agentic expansion bridge candidate"

[link_graph.index.delta]
full_rebuild_threshold = 256
