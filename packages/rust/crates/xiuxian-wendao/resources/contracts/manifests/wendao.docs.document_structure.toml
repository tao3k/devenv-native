id = "wendao.docs.document_structure"
version = 1
task_types = ["http_call", "cli_call"]

[http]
method = "GET"
path = "/api/docs/page-index-tree"
query = ["repo", "page_id"]

[cli]
argv = ["wendao", "docs", "tree"]

[cli.flags]
page_id = "--page-id"
repo = "--repo"

[tool]
name = "wendao.docs.get_document_structure"
schema_provider = "DocsDocumentStructureToolArgs"
runtime_injected = ["repo"]

[[params]]
name = "repo"
type = "string"
required = true

[[params]]
name = "page_id"
type = "string"
required = true
