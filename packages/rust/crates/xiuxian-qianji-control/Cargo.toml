[package]
name = "xiuxian-qianji-control"
version.workspace = true
edition.workspace = true
description = "Workflow-neutral Qianji control-plane contracts and in-memory runtime"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
duckdb = ["dep:duckdb"]
valkey = ["dep:redis", "dep:tokio"]

[dependencies]
async-trait = { workspace = true }
duckdb = { workspace = true, optional = true }
redis = { workspace = true, features = ["tokio-comp"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
