[package]
name = "xiuxian-llm"
version.workspace = true
edition.workspace = true
description = "LLM/embedding runtime primitives shared across xiuxian and xiuxian-daochang"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = ["provider-litellm"]
provider-litellm = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
num-traits = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
xiuxian-macros = { path = "../xiuxian-macros" }
xiuxian-config-core = { path = "../xiuxian-config-core" }
litellm-rs = { workspace = true, features = ["redis"] }
spider = { version = "2.45.29", default-features = false, features = ["sync", "reqwest_native_tls_native_roots"] }
xiuxian-testing = { path = "../xiuxian-testing" }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["toml", "xiuxian-config-core"]

[lib]
doctest = false
