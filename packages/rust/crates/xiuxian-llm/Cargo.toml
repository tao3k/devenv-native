[package]
name = "xiuxian-llm"
version.workspace = true
edition.workspace = true
description = "LLM/embedding runtime primitives shared across Xiuxian services"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = ["model-routing", "provider-litellm"]
model-routing = []
provider-litellm = ["dep:litellm-rs"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
num-traits = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }
xiuxian-macros = { path = "../xiuxian-macros" }
xiuxian-config-core = { path = "../xiuxian-config-core" }
litellm-rs = { workspace = true, features = ["redis"], optional = true }
spider = { version = "2.45.29", default-features = false, features = ["sync", "reqwest_native_tls_native_roots"] }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["toml", "xiuxian-config-core"]

[lib]
doctest = false
