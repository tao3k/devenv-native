[package]
name = "xiuxian-polyglot-orchestrator"
version.workspace = true
edition.workspace = true
description = "Thin polyglot control-plane contracts for Wendao compute lanes"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
julia-runtime = []
wendao-contracts = ["dep:xiuxian-wendao-runtime"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", default-features = false, optional = true }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
