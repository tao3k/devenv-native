[package]
name = "xiuxian-zhixing"
version.workspace = true
edition.workspace = true
description = "AI-driven Agenda and Journaling system for the Xiuxian ecosystem (Zhixing-Heyi)"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
redis = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
include_dir = { workspace = true }

# Local crates
xiuxian-wendao = { path = "../xiuxian-wendao" }

# Logging
log = { workspace = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
xiuxian-qianji = { path = "../xiuxian-qianji", features = ["wendao-integration"] }

[lints]
workspace = true
