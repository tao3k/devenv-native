[package]
name = "xiuxian-vector"
version.workspace = true
edition.workspace = true
description = "Lance-backed vector-table storage shell for Xiuxian"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = ["vector-store"]
vector-store = [
  "dep:lance",
  "dep:lance-file",
  "dep:lance-index",
  "dep:lance-linalg",
  "dep:xiuxian-lance",
]

[dependencies]
# LanceDB core
lance = { workspace = true, optional = true }
lance-file = { workspace = true, optional = true }
lance-index = { workspace = true, optional = true }
lance-linalg = { workspace = true, optional = true }

# RecordBatch utilities (extracted to xiuxian-lance)
xiuxian-lance = { path = "../xiuxian-lance", optional = true }

# Arrow IPC for search result batch (same version as lance's arrow for IPC compatibility)
arrow = { workspace = true }
arrow-ipc = { workspace = true }
lance_arrow_ipc = { workspace = true }
parquet = { workspace = true }
datafusion = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "fs"] }

# Async stream utilities
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Reuse our common types
xiuxian-types = { path = "../xiuxian-types" }

# Logging
log = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
lance = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true
