[package]
name = "xiuxian-wendao-julia"
version.workspace = true
edition.workspace = true
description = "External Julia Repo Intelligence plugin for xiuxian-wendao"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
walkdir = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
arrow = { workspace = true }
arrow-flight = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
inventory = { workspace = true }
tonic = { workspace = true }
xiuxian-memory-engine = { path = "../xiuxian-memory-engine" }
xiuxian-code-intelligence = { path = "../xiuxian-code-intelligence" }
xiuxian-polyglot-orchestrator = { path = "../xiuxian-polyglot-orchestrator" }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", features = ["transport"] }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
serial_test = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers" }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql" }

[lints]
workspace = true
