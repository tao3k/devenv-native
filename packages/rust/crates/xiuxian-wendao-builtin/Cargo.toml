[package]
name = "xiuxian-wendao-builtin"
version.workspace = true
edition.workspace = true
description = "Builtin plugin bundle and registry bootstrap for xiuxian-wendao hosts"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[dependencies]
inventory = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
xiuxian-julia-core = { path = "../xiuxian-julia-core" }
xiuxian-julia-runtime = { path = "../xiuxian-julia-runtime", features = ["wendao"] }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", default-features = false, features = ["transport"] }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core" }
toml = { workspace = true }

[build-dependencies]
rust-lang-project-harness = { workspace = true }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }

[lints]
workspace = true
