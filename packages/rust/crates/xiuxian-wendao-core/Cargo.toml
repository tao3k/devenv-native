[package]
name = "xiuxian-wendao-core"
version.workspace = true
edition.workspace = true
description = "Stable plugin contracts for xiuxian-wendao core/runtime extraction"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false

[features]
default = []
arrow-transport = ["dep:arrow"]

[dependencies]
arrow = { workspace = true, optional = true }
chrono = { workspace = true }
inventory = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
xiuxian-types = { path = "../xiuxian-types" }

[dev-dependencies]
rust-lang-project-harness = { workspace = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[lints]
workspace = true
