[package]
name = "xiuxian-qianji-client"
version.workspace = true
edition.workspace = true
description = "Xiuxian Qianji client CLI for Flowhub plan scenario operations"
authors.workspace = true
license.workspace = true
publish = false
default-run = "qianji-client"

[dependencies]
chrono = { workspace = true, features = ["std", "clock"] }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
orgize = { workspace = true }
xiuxian-qianji-bpmn-engine = { path = "../xiuxian-qianji-bpmn-engine" }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers" }

[dev-dependencies]
tempfile = { workspace = true }
rust-lang-project-harness = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "qianji-client"
path = "src/bin/qianji_client.rs"
