[package]
name = "xiuxian-qianji"
version.workspace = true
edition.workspace = true
description = "Qianji (Thousand Mechanisms) - High-performance probabilistic workflow engine"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["duckdb", "llm", "qianji-full"]
duckdb = [
  "dep:xiuxian-db-store",
  "xiuxian-db-store/qianji-bpmn-workflow-state",
  "xiuxian-qianji-control/duckdb",
]
llm = ["dep:xiuxian-llm"]
performance = []
valkey = ["xiuxian-qianji-control/valkey"]
qianji-full = [
  "duckdb",
  "llm",
  "dep:globset",
  "dep:include_dir",
  "dep:jsonschema",
  "dep:md5",
  "dep:merman-core",
  "dep:petgraph",
  "dep:quick-xml",
  "dep:rand",
  "dep:regex",
  "dep:reqwest",
  "dep:serde_yaml",
  "dep:tokio-util",
  "dep:walkdir",
  "dep:xiuxian-ast",
  "dep:xiuxian-logging",
  "dep:xiuxian-qianhuan",
  "dep:xiuxian-wendao",
  "xiuxian-wendao/search-runtime",
  "dep:xiuxian-wendao-sql",
  "dep:xiuxian-wendao-core",
  "dep:xiuxian-wendao-runtime",
  "dep:xiuxian-wendao-parsers",
  "dep:xiuxian-window",
  "dep:xiuxian-zhenfa",
]

[dependencies]
petgraph = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
ariadne = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
redis = { workspace = true, features = ["tokio-comp"] }
log = { workspace = true }
futures = { workspace = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
tempfile = { workspace = true }
merman-core = { workspace = true, optional = true }
quick-xml = { workspace = true, features = ["serialize"], optional = true }
reqwest = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
xiuxian-wendao = { path = "../xiuxian-wendao", default-features = false, optional = true }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql", optional = true }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core", optional = true }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", optional = true }
xiuxian-wendao-parsers = { path = "../xiuxian-wendao-parsers", optional = true }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }
xiuxian-qianhuan = { path = "../xiuxian-qianhuan", optional = true }
qianji-bpmn-engine = { path = "../qianji-bpmn-engine" }
xiuxian-ast = { path = "../xiuxian-ast", optional = true }
xiuxian-macros = { path = "../xiuxian-macros" }
xiuxian-zhenfa = { path = "../xiuxian-zhenfa", optional = true }
xiuxian-logging = { path = "../xiuxian-logging", optional = true }
xiuxian-llm = { path = "../xiuxian-llm", optional = true }
xiuxian-window = { path = "../xiuxian-window", optional = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-qianji-control = { path = "../xiuxian-qianji-control" }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
reqwest = { workspace = true }
rust-lang-project-harness = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true

[lib]
name = "xiuxian_qianji"
path = "src/lib.rs"

[[bin]]
name = "qianji"
path = "src/bin/qianji.rs"
required-features = ["llm", "qianji-full"]

[[bin]]
name = "qianji-server"
path = "src/bin/qianji_server.rs"

[[bench]]
name = "qianji_bpmn_runtime"
harness = false
required-features = ["performance"]

# Integration tests requiring llm feature
[[test]]
name = "llm_augmented_formal_audit"
path = "tests/integration/llm_augmented_formal_audit/mod.rs"
required-features = ["llm", "qianji-full"]

