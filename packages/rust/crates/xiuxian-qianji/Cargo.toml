[package]
name = "xiuxian-qianji"
version.workspace = true
edition.workspace = true
description = "Qianji (Thousand Mechanisms) - High-performance probabilistic workflow engine"
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["duckdb", "qianji-full"]
duckdb = [
  "run-console-flight",
  "dep:tokio-stream",
  "dep:xiuxian-db-store",
  "xiuxian-db-store/project-state",
  "xiuxian-db-store/qianji-bpmn-workflow-state",
  "xiuxian-qianji-control/duckdb",
]
run-console-flight = [
  "dep:arrow",
  "dep:arrow-flight",
  "dep:tonic",
  "dep:xiuxian-db-store",
  "xiuxian-db-store/arrow-codec",
]
performance = ["dep:criterion"]
valkey = [
  "dep:redis",
  "xiuxian-qianji-bpmn-engine/valkey",
  "xiuxian-qianji-control/valkey",
  "xiuxian-qianji-runtime/valkey",
]
advisory-prompt-pack-cache = [
  "qianji-full",
  "xiuxian-db-store/artifact-cache",
]
qianji-full = [
  "duckdb",
  "valkey",
  "dep:globset",
  "dep:include_dir",
  "dep:jsonschema",
  "dep:md5",
  "dep:merman-core",
  "dep:orgize",
  "dep:petgraph",
  "dep:quick-xml",
  "dep:rand",
  "dep:regex",
  "dep:reqwest",
  "dep:serde_yaml",
  "dep:tera",
  "dep:tokio-util",
  "dep:walkdir",
  "dep:xiuxian-logging",
  "dep:xiuxian-window",
  "dep:xiuxian-zhenfa",
]
wendao-integration = [
  "qianji-full",
  "dep:xiuxian-wendao",
  "xiuxian-wendao/duckdb",
  "dep:xiuxian-wendao-sql",
  "dep:xiuxian-wendao-core",
  "dep:xiuxian-wendao-runtime",
]

[dependencies]
petgraph = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
criterion = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
arrow-flight = { workspace = true, optional = true }
ariadne = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
log = { workspace = true }
futures = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
orgize = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
tempfile = { workspace = true }
merman-core = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
xiuxian-wendao = { path = "../xiuxian-wendao", default-features = false, optional = true }
xiuxian-wendao-sql = { path = "../xiuxian-wendao-sql", optional = true }
xiuxian-wendao-core = { path = "../xiuxian-wendao-core", optional = true }
xiuxian-wendao-runtime = { path = "../xiuxian-wendao-runtime", optional = true }
xiuxian-db-store = { path = "../xiuxian-db-store", default-features = false, optional = true }
xiuxian-qianji-bpmn-engine = { path = "../xiuxian-qianji-bpmn-engine", default-features = false }
xiuxian-qianji-client = { path = "../xiuxian-qianji-client" }
xiuxian-macros = { path = "../xiuxian-macros" }
xiuxian-zhenfa = { path = "../xiuxian-zhenfa", optional = true }
xiuxian-logging = { path = "../xiuxian-logging", optional = true }
xiuxian-window = { path = "../xiuxian-window", optional = true }
xiuxian-config-core = { path = "../xiuxian-config-core" }
xiuxian-qianji-control = { path = "../xiuxian-qianji-control" }
xiuxian-qianji-runtime = { path = "../xiuxian-qianji-runtime", default-features = false }
xiuxian-security = { path = "../xiuxian-security", features = ["axum-internal-plane"] }

[dev-dependencies]
insta = { workspace = true }
rust-lang-project-harness = { workspace = true }
tower = { workspace = true }

[build-dependencies]
xiuxian-rust-workspace-harness = { workspace = true }

[lints]
workspace = true

[lib]
name = "xiuxian_qianji"
path = "src/lib.rs"

[[bin]]
name = "qianji"
path = "src/bin/qianji.rs"
required-features = ["qianji-full", "wendao-integration"]

[[bin]]
name = "qianji-server"
path = "src/bin/qianji_server.rs"

[[bench]]
name = "qianji_bpmn_runtime"
harness = false
required-features = ["performance"]

[[test]]
name = "runtime_config"
path = "tests/integration/runtime_config/mod.rs"

[[test]]
name = "contract_feedback_pipeline"
path = "tests/integration/contract_feedback_pipeline.rs"
required-features = ["qianji-full", "wendao-integration"]

[[test]]
name = "flowhub_contracts"
path = "tests/integration/flowhub_contracts/mod.rs"
required-features = ["qianji-full"]

[[test]]
name = "flowhub_manifest_contracts"
path = "tests/integration/flowhub_manifest_contracts/mod.rs"
required-features = ["qianji-full"]

[[test]]
name = "flowhub_materialize"
path = "tests/integration/flowhub_materialize.rs"
required-features = ["qianji-full"]

[[test]]
name = "flowhub_scenario_show_check"
path = "tests/integration/flowhub_scenario_show_check.rs"
required-features = ["qianji-full"]

[[test]]
name = "audit_scenario_contract"
path = "tests/integration/test_audit_scenario_contract.rs"
required-features = ["qianji-full"]

[[test]]
name = "formal_audit_advisory_executor"
path = "tests/integration/test_formal_audit_advisory_executor.rs"
required-features = ["qianji-full"]

[[test]]
name = "wendao_persisted_rest_docs_contract_feedback"
path = "tests/integration/test_wendao_persisted_rest_docs_contract_feedback.rs"
required-features = ["qianji-full", "wendao-integration"]

[[test]]
name = "wendao_live_rest_docs_contract_feedback"
path = "tests/integration/test_wendao_live_rest_docs_contract_feedback.rs"
required-features = ["qianji-full", "wendao-integration"]

# Unit tests for telemetry
[[test]]
name = "unit_telemetry_events"
path = "tests/unit/unit_telemetry_events.rs"

[[test]]
name = "workdir_contracts"
path = "tests/integration/workdir_contracts.rs"
required-features = ["qianji-full", "wendao-integration"]
