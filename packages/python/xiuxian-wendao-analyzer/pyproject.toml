[project]
name = "xiuxian-wendao-analyzer"
version = "0.2.1"
description = "Wendao analyzer package for Arrow-backed analysis and Docling document parsing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=14.0.0",
    "wendao-arrow-interface",
    "wendao-core-lib",
]

[project.optional-dependencies]
documents = [
    "docling[xbrl]>=2.70.0",
]
documents-audio = [
    "docling[xbrl]>=2.70.0",
    "imageio-ffmpeg>=0.6.0",
    "openai-whisper>=20250625",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "python-lang-project-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
xiuxian-wendao-document-extract = "xiuxian_wendao_analyzer.document_service:main"
wendao-document-extract = "xiuxian_wendao_analyzer.document_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xiuxian_wendao_analyzer"]

[tool.uv]
package = true

[tool.uv.sources]
wendao-core-lib = { workspace = true }
wendao-arrow-interface = { workspace = true }
python-lang-project-harness = { git = "https://github.com/tao3k/python-lang-project-harness", rev = "11bd8e60921541ecaf9afcc9502b7b0811d3d108" }
