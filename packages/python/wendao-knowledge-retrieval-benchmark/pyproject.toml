[project]
name = "wendao-knowledge-retrieval-benchmark"
version = "0.1.0"
description = "Black-box benchmark harness for Wendao knowledge retrieval profiles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wendao-knowledge-retrieval-benchmark = "wendao_knowledge_retrieval_benchmark.cli:main"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "python-lang-project-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wendao_knowledge_retrieval_benchmark"]

[tool.uv]
package = true

[tool.python-lang-project-harness]
blocking_severities = ["error"]

[tool.uv.sources]
python-lang-project-harness = { git = "https://github.com/tao3k/python-lang-project-harness", rev = "77954cbc065aa621c1b08d23028dbf3757894fe2" }
