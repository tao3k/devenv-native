[project]
name = "xiuxian-harness-python-lang-project"
version = "0.1.0"
description = "Project-level Python-native AST and symbol-table harness for modern Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-lang-parser",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiuxian_harness_python_lang_project"]

[tool.uv.sources]
python-lang-parser = { workspace = true }

[tool.uv]
package = true
