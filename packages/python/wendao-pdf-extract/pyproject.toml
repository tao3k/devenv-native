[project]
name = "wendao-pdf-extract"
version = "0.1.0"
description = "Arrow Flight PDF extraction service for Wendao using OpenDataLoader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "opendataloader-pdf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wendao_pdf_extract"]

[tool.uv]
package = true

[project.scripts]
wendao-pdf-extract = "wendao_pdf_extract.server:main"
