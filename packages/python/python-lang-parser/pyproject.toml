[project]
name = "python-lang-parser"
version = "0.1.0"
description = "Python-native AST and symbol-table parser for modern Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_lang_parser"]

[tool.uv]
package = true
