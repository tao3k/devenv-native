imports = [
    "assets/wendao/github-repo-list.toml",
    "assets/wendao/wendao.toml",
]

[gateway]
port = 9517
webhook_enabled = true
webhook_url = "http://127.0.0.1:9999"

[gateway.runtime]
studio_request_timeout_secs = 30

[document_extract]
endpoint = "http://127.0.0.1:50051"

[model_routing]
mode = "deterministic"
vllm_sr_base_url = "http://127.0.0.1:8888"
default_provider = "deepseek"

[model_routing.chat]
provider = "deepseek"
model = "deepseek-chat"
backend_profile = "openai-compatible-chat-v1"

[model_routing.audio_transcript]
provider = "openrouter"
model = "qwen/qwen3-asr-flash-2026-02-10"
backend_profile = "hosted-audio-transcript-v1"

[model_routing.image_extract]
provider = "openrouter"
model = "qwen/qwen3-vl-8b-instruct"
backend_profile = "hosted-vlm-image-extract-v1"

[sources]
include_dirs = [
    "docs",
    "semantic",
    "packages/rust/crates/xiuxian-wendao",
    "packages/rust/crates/xiuxian-wendao/src/link_graph",
    "packages/python/wendao-knowledge-retrieval-benchmark",
]
exclude_dirs = [
    "node_modules",
    "target",
]

