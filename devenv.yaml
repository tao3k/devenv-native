inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs-latest
  llm-agents:
    url: github:numtide/llm-agents.nix
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs
  nixpkgs-latest:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  omnibus:
    url: github:tao3k/omnibus
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs-latest
secretspec:
  enable: true
  profile: default
  provider: dotenv
