name: "Xiuxian Artisan Workshop Valkey Live"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  valkey-live:
    runs-on: ubuntu-latest
    env:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      CARGO_TARGET_DIR: /tmp/workspace-strict-proof
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/common-setup
        with:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

      - name: Run full live Valkey webhook verification
        run: secretspec run --provider env --profile default -- devenv tasks run ci:valkey-live
