name: Build and publish container images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: xiuxian-wendao
            flake-attr: container-wendao
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - uses: ./.github/actions/common-setup
        with:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image and copyTo script
        run: nix build .#${{ matrix.image.flake-attr }}.copyTo

      - name: Push to GHCR
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::Pushing $tag"
            ./result/bin/copy-to "docker://${tag}"
            echo "::endgroup::"
          done <<< "${{ steps.meta.outputs.tags }}"
