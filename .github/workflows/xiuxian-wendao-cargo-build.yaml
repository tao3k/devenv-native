            exit 1
          fi
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Install sccache
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
