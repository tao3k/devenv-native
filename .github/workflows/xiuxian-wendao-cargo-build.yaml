            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  cargo-build-macos:
    name: Cargo build - macOS
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/rust
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 5G
    steps:
      - uses: actions/checkout@v6

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for formula in protobuf pkg-config cmake; do
            brew list "${formula}" >/dev/null 2>&1 || brew install "${formula}"
          done

      - name: Export protobuf environment
        shell: bash
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
