name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-format:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt

      - name: Check Rust formatting
        run: scripts/rust/cargo_exec.sh fmt --all --check

  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            libxml2-utils \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev

      - name: Install macOS build dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          for formula in protobuf pkg-config cmake libxml2; do
            brew list "${formula}" >/dev/null 2>&1 || brew install "${formula}"
          done
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            elif command -v brew >/dev/null 2>&1; then
              brew_prefix="$(brew --prefix protobuf 2>/dev/null || true)"
              if [[ -n "${brew_prefix}" && -d "${brew_prefix}/include/google/protobuf" ]]; then
                proto_include="${brew_prefix}/include"
              fi
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Run Rust lint
        run: scripts/rust/cargo_exec.sh clippy --workspace --all-targets -- -D warnings

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install cocogitto
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: cocogitto

      - name: Check commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-list --max-parents=0 "${head_sha}" | tail -n 1)"
            fi
          fi
          cog check "${base_sha}..${head_sha}"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev

      - name: Install macOS build dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          for formula in protobuf pkg-config cmake; do
            brew list "${formula}" >/dev/null 2>&1 || brew install "${formula}"
          done

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            elif command -v brew >/dev/null 2>&1; then
              brew_prefix="$(brew --prefix protobuf 2>/dev/null || true)"
              if [[ -n "${brew_prefix}" && -d "${brew_prefix}/include/google/protobuf" ]]; then
                proto_include="${brew_prefix}/include"
              fi
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: cargo-nextest@0.9.127

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Materialize WendaoSearch package checkout
        run: |
          set -euo pipefail
          source scripts/channel/process-runtime.sh
          source scripts/channel/wendaosearch-common.sh
          wendaosearch_materialize_package_repo "${GITHUB_WORKSPACE}"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/scripts/run_parser_summary_service.jl"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/config/live/parser_summary.toml"

      - name: Run Rust workspace tests
        run: scripts/rust/cargo_exec.sh nextest run --workspace --exclude xiuxian-core-rs --no-fail-fast

      - name: Run xiuxian-core-rs tests
        run: bash scripts/rust/test_xiuxian_core_rs.sh --lib --no-fail-fast

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
