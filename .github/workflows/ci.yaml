name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt

      - name: Check Rust formatting
        run: scripts/rust/cargo_exec.sh fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            libxml2-utils \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy

      - name: Install sccache
        uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Run Rust lint
        run: scripts/rust/cargo_exec.sh clippy --workspace --all-targets -- -D warnings

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install cocogitto
        uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2
        with:
          tool: cocogitto

      - name: Check commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-list --max-parents=0 "${head_sha}" | tail -n 1)"
            fi
          fi
          cog check "${base_sha}..${head_sha}"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      PRJ_CACHE_HOME: ${{ github.workspace }}/.cache
      PRJ_CONFIG_HOME: ${{ github.workspace }}/.config
      PRJ_DATA_HOME: ${{ github.workspace }}/.data
      PRJ_PATH: ${{ github.workspace }}/.bin
      PRJ_ROOT: ${{ github.workspace }}
      PRJ_RUNTIME_DIR: ${{ github.workspace }}/.run
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"
          show-versioninfo: "never"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            libxml2-utils \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev \
            valkey

      - name: Install macOS build dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          for formula in protobuf pkg-config cmake libxml2 valkey; do
            brew list "${formula}" >/dev/null 2>&1 || brew install "${formula}"
          done
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            elif command -v brew >/dev/null 2>&1; then
              brew_prefix="$(brew --prefix protobuf 2>/dev/null || true)"
              if [[ -n "${brew_prefix}" && -d "${brew_prefix}/include/google/protobuf" ]]; then
                proto_include="${brew_prefix}/include"
              fi
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2
        with:
          tool: cargo-nextest@0.9.127

      - name: Install sccache
        uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Materialize linked Julia package checkouts
        run: |
          set -euo pipefail
          source scripts/channel/process-runtime.sh
          source scripts/channel/wendaosearch-common.sh
          managed_materialize_git_repo \
            "${GITHUB_WORKSPACE}/.data/WendaoArrow.jl" \
            "https://github.com/tao3k/WendaoArrow.jl.git" \
            "" \
            "WendaoArrow package checkout"
          managed_materialize_git_repo \
            "${GITHUB_WORKSPACE}/.data/WendaoAnalyzer.jl" \
            "https://github.com/tao3k/WendaoAnalyzer.jl.git" \
            "" \
            "WendaoAnalyzer package checkout"
          wendaosearch_materialize_package_repo "${GITHUB_WORKSPACE}"
          wendaosearch_project="${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/Project.toml"
          wendao_arrow_rev="$(
            julia -e 'using TOML; print(TOML.parsefile(ARGS[1])["sources"]["WendaoArrow"]["rev"])' \
              "${wendaosearch_project}"
          )"
          wendao_code_parser_rev="$(
            julia -e 'using TOML; print(TOML.parsefile(ARGS[1])["sources"]["WendaoCodeParser"]["rev"])' \
              "${wendaosearch_project}"
          )"
          git -C "${GITHUB_WORKSPACE}/.data/WendaoArrow.jl" fetch --tags --prune origin
          git -C "${GITHUB_WORKSPACE}/.data/WendaoArrow.jl" checkout --detach "${wendao_arrow_rev}"
          managed_materialize_git_repo \
            "${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl" \
            "https://github.com/tao3k/WendaoCodeParser.jl.git" \
            "${wendao_code_parser_rev}" \
            "WendaoCodeParser package checkout"
          git -C "${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl" fetch --tags --prune origin
          git -C "${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl" checkout --detach "${wendao_code_parser_rev}"
          wendaosearch_repair_wendaocodeparser_checkout \
            "${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl"
          arrow_rev="$(
            julia -e 'using TOML; print(TOML.parsefile(ARGS[1])["sources"]["Arrow"]["rev"])' \
              "${GITHUB_WORKSPACE}/.data/WendaoArrow.jl/Project.toml"
          )"
          managed_materialize_git_repo \
            "${GITHUB_WORKSPACE}/.data/arrow-julia" \
            "https://github.com/JuliaCN/arrow-julia.git" \
            "${arrow_rev}" \
            "Arrow package checkout"
          git -C "${GITHUB_WORKSPACE}/.data/arrow-julia" fetch --tags --prune origin
          git -C "${GITHUB_WORKSPACE}/.data/arrow-julia" checkout --detach "${arrow_rev}"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoArrow.jl/scripts/run_flight_example.jl"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoAnalyzer.jl/scripts/run_analyzer_example.jl"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl/src/WendaoCodeParser.jl"
          test -f "${GITHUB_WORKSPACE}/.data/arrow-julia/Project.toml"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/scripts/run_parser_summary_service.jl"
          test -f "${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/config/live/parser_summary.toml"

      - name: Verify Julia toolchain
        run: |
          set -euo pipefail
          command -v julia
          julia --version

      - name: Bootstrap WendaoSearch parser-summary runtime dependencies
        run: |
          set -euo pipefail
          export WENDAO_SEARCH_BOOTSTRAP_ENV="${RUNNER_TEMP}/wendaosearch-env"
          export WENDAO_SEARCH_LOCAL_ARROW_PATH="${GITHUB_WORKSPACE}/.data/arrow-julia"
          export WENDAO_SEARCH_LOCAL_WENDAO_ARROW_PATH="${GITHUB_WORKSPACE}/.data/WendaoArrow.jl"
          export WENDAO_SEARCH_LOCAL_WENDAO_CODE_PARSER_PATH="${GITHUB_WORKSPACE}/.data/WendaoCodeParser.jl"
          julia "${GITHUB_WORKSPACE}/.data/WendaoSearch.jl/scripts/prepare_wendao_search_env.jl"
          julia --project="${WENDAO_SEARCH_BOOTSTRAP_ENV}" -e '
            using Pkg
            Pkg.precompile()
          '
          {
            echo "WENDAO_SEARCH_BOOTSTRAP_ENV=${WENDAO_SEARCH_BOOTSTRAP_ENV}"
            echo "WENDAO_SEARCH_LOCAL_ARROW_PATH=${WENDAO_SEARCH_LOCAL_ARROW_PATH}"
            echo "WENDAO_SEARCH_LOCAL_WENDAO_ARROW_PATH=${WENDAO_SEARCH_LOCAL_WENDAO_ARROW_PATH}"
            echo "WENDAO_SEARCH_LOCAL_WENDAO_CODE_PARSER_PATH=${WENDAO_SEARCH_LOCAL_WENDAO_CODE_PARSER_PATH}"
            echo "WENDAOSEARCH_JULIA_PROJECT=${WENDAO_SEARCH_BOOTSTRAP_ENV}"
          } >> "${GITHUB_ENV}"

      - name: Start WendaoSearch parser-summary service for Rust tests
        run: |
          set -euo pipefail
          export WENDAOSEARCH_SERVICE_NAME=wendaosearch-parser-summary
          export WENDAOSEARCH_RUNTIME_DIR=.run/wendaosearch
          export WENDAOSEARCH_CONFIG=.data/WendaoSearch.jl/config/live/parser_summary.toml
          export WENDAOSEARCH_SCRIPT=run_parser_summary_service.jl
          : "${WENDAO_SEARCH_BOOTSTRAP_ENV:?missing WendaoSearch bootstrap env}"
          export WENDAOSEARCH_JULIA_PROJECT="${WENDAO_SEARCH_BOOTSTRAP_ENV}"
          mkdir -p "${WENDAOSEARCH_RUNTIME_DIR}" .run/logs
          bash scripts/channel/wendaosearch-launch.sh \
            > .run/logs/wendaosearch-parser-summary.stdout.log \
            2> .run/logs/wendaosearch-parser-summary.stderr.log &
          launcher_pid=$!
          echo "${launcher_pid}" > "${WENDAOSEARCH_RUNTIME_DIR}/${WENDAOSEARCH_SERVICE_NAME}.launcher.pid"
          for _ in {1..120}; do
            if bash scripts/channel/wendaosearch-healthcheck.sh >/dev/null 2>&1; then
              echo "RUN_PROCESS_MANAGED_WENDAOSEARCH_TEST=1" >> "${GITHUB_ENV}"
              exit 0
            fi
            if ! kill -0 "${launcher_pid}" 2>/dev/null; then
              echo "WendaoSearch parser-summary launcher exited before readiness." >&2
              cat .run/logs/wendaosearch-parser-summary.stdout.log >&2 || true
              cat .run/logs/wendaosearch-parser-summary.stderr.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          cat .run/logs/wendaosearch-parser-summary.stdout.log >&2 || true
          cat .run/logs/wendaosearch-parser-summary.stderr.log >&2 || true
          bash scripts/channel/wendaosearch-healthcheck.sh

      - name: Start Valkey for Rust tests
        run: |
          set -euo pipefail
          if valkey-cli -u redis://127.0.0.1:6379/0 ping >/dev/null 2>&1; then
            echo "VALKEY_URL=redis://127.0.0.1:6379/0" >> "${GITHUB_ENV}"
            exit 0
          fi
          mkdir -p "${PRJ_RUNTIME_DIR}/valkey" "${PRJ_DATA_HOME}/valkey"
          valkey-server \
            --daemonize yes \
            --bind 127.0.0.1 \
            --port 6379 \
            --dir "${PRJ_DATA_HOME}/valkey" \
            --pidfile "${PRJ_RUNTIME_DIR}/valkey/valkey.pid"
          for _ in {1..30}; do
            if valkey-cli -u redis://127.0.0.1:6379/0 ping >/dev/null 2>&1; then
              echo "VALKEY_URL=redis://127.0.0.1:6379/0" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done
          echo "Valkey did not become ready on redis://127.0.0.1:6379/0" >&2
          exit 1

      - name: Run Rust workspace tests
        run: scripts/rust/cargo_exec.sh nextest run --workspace --exclude xiuxian-core-rs --no-fail-fast

      - name: Run xiuxian-core-rs tests
        run: bash scripts/rust/test_xiuxian_core_rs.sh --lib --no-fail-fast

      - name: Stop shell-managed services
        if: ${{ always() }}
        run: |
          set +e
          source scripts/channel/process-runtime.sh
          managed_cleanup_pidfile_process \
            .run/wendaosearch/wendaosearch-parser-summary.pid \
            wendaosearch-parser-summary \
            julia \
            run_parser_summary_service.jl
          managed_cleanup_pidfile_process \
            .run/wendaosearch/wendaosearch-parser-summary.launcher.pid \
            wendaosearch-parser-summary-launcher \
            wendaosearch-launch.sh
          managed_cleanup_pidfile_process \
            "${PRJ_RUNTIME_DIR:-.run}/valkey/valkey.pid" \
            valkey \
            valkey-server

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
