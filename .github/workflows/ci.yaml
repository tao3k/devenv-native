name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt

      - name: Check Rust formatting
        run: scripts/rust/cargo_exec.sh fmt --all --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake \
            libxml2-utils \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy

      - name: Install sccache
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Run Rust lint
        run: scripts/rust/cargo_exec.sh clippy --workspace --all-targets -- -D warnings

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install cocogitto
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2
        with:
          tool: cocogitto

      - name: Check commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [ "${base_sha}" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-list --max-parents=0 "${head_sha}" | tail -n 1)"
            fi
          fi
          cog check "${base_sha}..${head_sha}"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      PRJ_CACHE_HOME: ${{ github.workspace }}/.cache
      PRJ_CONFIG_HOME: ${{ github.workspace }}/.config
      PRJ_DATA_HOME: ${{ github.workspace }}/.data
      PRJ_PATH: ${{ github.workspace }}/.bin
      PRJ_ROOT: ${{ github.workspace }}
      PRJ_RUNTIME_DIR: ${{ github.workspace }}/.run
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          show-versioninfo: "never"

      - name: Read Rust toolchain channel
        id: rust
        run: |
          set -euo pipefail
          channel="$(awk -F'"' '/^channel = / { print $2 }' packages/rust/rust-toolchain.toml)"
          if [[ -z "${channel}" ]]; then
            echo "Failed to resolve Rust toolchain channel from packages/rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            cmake \
            libxml2-utils \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            python3-dev \
            valkey

      - name: Install macOS build dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          for formula in autoconf automake protobuf pkg-config cmake libxml2 valkey; do
            brew list "${formula}" >/dev/null 2>&1 || brew install "${formula}"
          done
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: Export Rust build environment
        run: |
          set -euo pipefail
          protoc_path="$(command -v protoc)"
          if [[ -z "${protoc_path}" ]]; then
            echo "protoc not found on PATH"
            exit 1
          fi
          proto_include=""
          if [[ -d /usr/include/google/protobuf ]]; then
            proto_include="/usr/include"
          else
            protoc_root="$(dirname "$(dirname "${protoc_path}")")"
            if [[ -d "${protoc_root}/include/google/protobuf" ]]; then
              proto_include="${protoc_root}/include"
            elif command -v brew >/dev/null 2>&1; then
              brew_prefix="$(brew --prefix protobuf 2>/dev/null || true)"
              if [[ -n "${brew_prefix}" && -d "${brew_prefix}/include/google/protobuf" ]]; then
                proto_include="${brew_prefix}/include"
              fi
            fi
          fi
          if [[ -z "${proto_include}" ]]; then
            echo "Failed to resolve protobuf include directory for well-known types"
            exit 1
          fi
          python_path="$(python -c 'import sys; print(sys.executable)')"
          echo "PROTOC=${protoc_path}" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=${proto_include}" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=${python_path}" >> "$GITHUB_ENV"
          protoc --version
          echo "PROTOC_INCLUDE=${proto_include}"
          python --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2
        with:
          tool: cargo-nextest@0.9.127

      - name: Install sccache
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2
        with:
          tool: sccache@0.7.5

      - name: Configure sccache backend
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-
            rust-workspace-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: rust-workspace-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Verify Julia toolchain
        run: |
          set -euo pipefail
          command -v julia
          julia --version

      - name: Bootstrap WendaoCodeParser parser-summary runtime dependencies
        run: |
          set -euo pipefail
          export JULIA_PKG_PRECOMPILE_AUTO=0
          export WENDAO_CODE_PARSER_PACKAGE_DIR="${RUNNER_TEMP}/WendaoCodeParser.jl"
          export WENDAO_CODE_PARSER_JULIA_PROJECT="${WENDAO_CODE_PARSER_PACKAGE_DIR}"
          git clone --depth 1 --branch main https://github.com/tao3k/WendaoCodeParser.jl.git "${WENDAO_CODE_PARSER_PACKAGE_DIR}"
          git -C "${WENDAO_CODE_PARSER_PACKAGE_DIR}" rev-parse HEAD
          julia --project="${WENDAO_CODE_PARSER_JULIA_PROJECT}" -e '
            using Pkg
            Pkg.activate(ENV["WENDAO_CODE_PARSER_JULIA_PROJECT"])
            Pkg.instantiate()
            Pkg.precompile()
            using WendaoCodeParser
          '
          test -f "${WENDAO_CODE_PARSER_PACKAGE_DIR}/scripts/run_service.jl"
          test -f "${WENDAO_CODE_PARSER_PACKAGE_DIR}/config/live/parser_summary.toml"
          {
            echo "JULIA_PKG_PRECOMPILE_AUTO=0"
            echo "WENDAO_CODE_PARSER_JULIA_PROJECT=${WENDAO_CODE_PARSER_JULIA_PROJECT}"
            echo "WENDAO_CODE_PARSER_PACKAGE_DIR=${WENDAO_CODE_PARSER_PACKAGE_DIR}"
            echo "WENDAO_CODE_PARSER_CONFIG=${WENDAO_CODE_PARSER_PACKAGE_DIR}/config/live/parser_summary.toml"
            echo "WENDAO_PARSER_SUMMARY_BASE_URL=http://127.0.0.1:41081"
            echo "WENDAOSEARCH_CONFIG=${WENDAO_CODE_PARSER_PACKAGE_DIR}/config/live/parser_summary.toml"
            echo "RUN_PROCESS_MANAGED_WENDAOSEARCH_TEST=1"
          } >> "${GITHUB_ENV}"

      - name: Start WendaoCodeParser parser-summary service for Rust tests
        run: |
          set -euo pipefail
          source scripts/channel/process-runtime.sh
          export WENDAO_CODE_PARSER_SERVICE_NAME=wendaocodeparser-parser-summary
          export WENDAO_CODE_PARSER_RUNTIME_DIR=.run/wendaocodeparser
          export WENDAO_CODE_PARSER_PORT=41081
          : "${WENDAO_CODE_PARSER_JULIA_PROJECT:?missing WendaoCodeParser Julia project}"
          : "${WENDAO_CODE_PARSER_PACKAGE_DIR:?missing WendaoCodeParser package dir}"
          export WENDAO_CODE_PARSER_CONFIG="${WENDAO_CODE_PARSER_PACKAGE_DIR}/config/live/parser_summary.toml"
          export WENDAO_CODE_PARSER_SCRIPT="${WENDAO_CODE_PARSER_PACKAGE_DIR}/scripts/run_service.jl"
          export WENDAO_CODE_PARSER_PIDFILE="${WENDAO_CODE_PARSER_RUNTIME_DIR}/${WENDAO_CODE_PARSER_SERVICE_NAME}.pid"
          export WENDAOCODEPARSER_CONFIG="${WENDAO_CODE_PARSER_CONFIG}"
          mkdir -p "${WENDAO_CODE_PARSER_RUNTIME_DIR}" .run/logs
          managed_cleanup_pidfile_process \
            "${WENDAO_CODE_PARSER_PIDFILE}" \
            "${WENDAO_CODE_PARSER_SERVICE_NAME}" \
            julia \
            "${WENDAO_CODE_PARSER_SCRIPT}"
          managed_cleanup_listener \
            "${WENDAO_CODE_PARSER_PORT}" \
            "${WENDAO_CODE_PARSER_SERVICE_NAME}" \
            julia \
            "${WENDAO_CODE_PARSER_SCRIPT}"
          julia "--project=${WENDAO_CODE_PARSER_JULIA_PROJECT}" \
            "${WENDAO_CODE_PARSER_SCRIPT}" \
            "--config" "${WENDAO_CODE_PARSER_CONFIG}" \
            > .run/logs/wendaocodeparser-parser-summary.stdout.log \
            2> .run/logs/wendaocodeparser-parser-summary.stderr.log &
          service_pid=$!
          managed_write_pidfile "${WENDAO_CODE_PARSER_PIDFILE}" "${service_pid}"
          for _ in {1..120}; do
            if managed_listener_matches_pidfile "${WENDAO_CODE_PARSER_PIDFILE}" "${WENDAO_CODE_PARSER_PORT}"; then
              exit 0
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              echo "WendaoCodeParser parser-summary service exited before readiness." >&2
              cat .run/logs/wendaocodeparser-parser-summary.stdout.log >&2 || true
              cat .run/logs/wendaocodeparser-parser-summary.stderr.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          cat .run/logs/wendaocodeparser-parser-summary.stdout.log >&2 || true
          cat .run/logs/wendaocodeparser-parser-summary.stderr.log >&2 || true
          managed_listener_matches_pidfile "${WENDAO_CODE_PARSER_PIDFILE}" "${WENDAO_CODE_PARSER_PORT}"

      - name: Bootstrap WendaoSearch solver-demo runtime dependencies
        run: |
          set -euo pipefail
          export WENDAOSEARCH_PACKAGE_DIR="${RUNNER_TEMP}/WendaoSearch.jl"
          export WENDAOSEARCH_JULIA_PROJECT="${WENDAOSEARCH_PACKAGE_DIR}"
          git clone --depth 1 --branch main https://github.com/tao3k/WendaoSearch.jl.git "${WENDAOSEARCH_PACKAGE_DIR}"
          git -C "${WENDAOSEARCH_PACKAGE_DIR}" rev-parse HEAD
          julia --project="${WENDAOSEARCH_JULIA_PROJECT}" -e '
            using Pkg
            Pkg.activate(ENV["WENDAOSEARCH_JULIA_PROJECT"])
            Pkg.instantiate()
            Pkg.precompile()
            using WendaoSearch
          '
          test -f "${WENDAOSEARCH_PACKAGE_DIR}/scripts/run_search_service.jl"
          test -f "${WENDAOSEARCH_PACKAGE_DIR}/config/live/solver_demo.toml"
          {
            echo "WENDAO_SEARCH_USE_ACTIVE_PROJECT=1"
            echo "WENDAOSEARCH_JULIA_PROJECT=${WENDAOSEARCH_JULIA_PROJECT}"
            echo "WENDAOSEARCH_PACKAGE_DIR=${WENDAOSEARCH_PACKAGE_DIR}"
            echo "WENDAOSEARCH_SOLVER_DEMO_CONFIG=${WENDAOSEARCH_PACKAGE_DIR}/config/live/solver_demo.toml"
          } >> "${GITHUB_ENV}"

      - name: Start WendaoSearch solver-demo service for Rust tests
        run: |
          set -euo pipefail
          source scripts/channel/process-runtime.sh
          export WENDAOSEARCH_SERVICE_NAME=wendaosearch-solver-demo
          export WENDAOSEARCH_RUNTIME_DIR=.run/wendaosearch
          export WENDAOSEARCH_PORT=41080
          : "${WENDAOSEARCH_JULIA_PROJECT:?missing WendaoSearch Julia project}"
          : "${WENDAOSEARCH_PACKAGE_DIR:?missing WendaoSearch package dir}"
          : "${WENDAOSEARCH_SOLVER_DEMO_CONFIG:?missing WendaoSearch solver-demo config}"
          export WENDAOSEARCH_SCRIPT="${WENDAOSEARCH_PACKAGE_DIR}/scripts/run_search_service.jl"
          export WENDAOSEARCH_PIDFILE="${WENDAOSEARCH_RUNTIME_DIR}/${WENDAOSEARCH_SERVICE_NAME}.pid"
          export WENDAO_SEARCH_USE_ACTIVE_PROJECT=1
          mkdir -p "${WENDAOSEARCH_RUNTIME_DIR}" .run/logs
          managed_cleanup_pidfile_process \
            "${WENDAOSEARCH_PIDFILE}" \
            "${WENDAOSEARCH_SERVICE_NAME}" \
            julia \
            "${WENDAOSEARCH_SCRIPT}"
          managed_cleanup_listener \
            "${WENDAOSEARCH_PORT}" \
            "${WENDAOSEARCH_SERVICE_NAME}" \
            julia \
            "${WENDAOSEARCH_SCRIPT}"
          julia "--project=${WENDAOSEARCH_JULIA_PROJECT}" \
            "${WENDAOSEARCH_SCRIPT}" \
            "--config" "${WENDAOSEARCH_SOLVER_DEMO_CONFIG}" \
            > .run/logs/wendaosearch-solver-demo.stdout.log \
            2> .run/logs/wendaosearch-solver-demo.stderr.log &
          service_pid=$!
          managed_write_pidfile "${WENDAOSEARCH_PIDFILE}" "${service_pid}"
          for _ in {1..180}; do
            if managed_listener_matches_pidfile "${WENDAOSEARCH_PIDFILE}" "${WENDAOSEARCH_PORT}"; then
              echo "WENDAOSEARCH_SOLVER_DEMO_BASE_URL=http://127.0.0.1:${WENDAOSEARCH_PORT}" >> "${GITHUB_ENV}"
              exit 0
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              echo "WendaoSearch solver-demo service exited before readiness." >&2
              cat .run/logs/wendaosearch-solver-demo.stdout.log >&2 || true
              cat .run/logs/wendaosearch-solver-demo.stderr.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          cat .run/logs/wendaosearch-solver-demo.stdout.log >&2 || true
          cat .run/logs/wendaosearch-solver-demo.stderr.log >&2 || true
          managed_listener_matches_pidfile "${WENDAOSEARCH_PIDFILE}" "${WENDAOSEARCH_PORT}"

      - name: Start Valkey for Rust tests
        run: |
          set -euo pipefail
          if valkey-cli -u redis://127.0.0.1:6379/0 ping >/dev/null 2>&1; then
            echo "VALKEY_URL=redis://127.0.0.1:6379/0" >> "${GITHUB_ENV}"
            exit 0
          fi
          mkdir -p "${PRJ_RUNTIME_DIR}/valkey" "${PRJ_DATA_HOME}/valkey"
          valkey-server \
            --daemonize yes \
            --bind 127.0.0.1 \
            --port 6379 \
            --dir "${PRJ_DATA_HOME}/valkey" \
            --pidfile "${PRJ_RUNTIME_DIR}/valkey/valkey.pid"
          for _ in {1..30}; do
            if valkey-cli -u redis://127.0.0.1:6379/0 ping >/dev/null 2>&1; then
              echo "VALKEY_URL=redis://127.0.0.1:6379/0" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done
          echo "Valkey did not become ready on redis://127.0.0.1:6379/0" >&2
          exit 1

      - name: Run Rust workspace tests
        run: scripts/rust/cargo_exec.sh nextest run --workspace --exclude xiuxian-core-rs --no-fail-fast

      - name: Run xiuxian-core-rs tests
        run: bash scripts/rust/test_xiuxian_core_rs.sh --lib --no-fail-fast

      - name: Stop shell-managed services
        if: ${{ always() }}
        run: |
          set +e
          source scripts/channel/process-runtime.sh
          managed_cleanup_pidfile_process \
            .run/wendaocodeparser/wendaocodeparser-parser-summary.pid \
            wendaocodeparser-parser-summary \
            julia \
            run_service.jl
          managed_cleanup_pidfile_process \
            .run/wendaosearch/wendaosearch-solver-demo.pid \
            wendaosearch-solver-demo \
            julia \
            run_search_service.jl
          managed_cleanup_pidfile_process \
            "${PRJ_RUNTIME_DIR:-.run}/valkey/valkey.pid" \
            valkey \
            valkey-server

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: rust-workspace-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'packages/rust/rust-toolchain.toml', '.github/workflows/ci.yaml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        run: |
          {
            echo "### sccache stats";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
