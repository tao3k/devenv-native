[workspace]
resolver = "2"

# Include all Rust crates explicitly (no glob to avoid missing crate errors)
members = [
  "packages/rust/bindings/python",
  "packages/rust/crates/xiuxian-config-core",
  "packages/rust/crates/xiuxian-ast",
  "packages/rust/crates/xiuxian-edit",
  "packages/rust/crates/xiuxian-event",
  "packages/rust/crates/xiuxian-graph-core",
  "packages/rust/crates/xiuxian-io",
  "packages/rust/crates/xiuxian-git-repo",
  "packages/rust/crates/xiuxian-wendao-attachments",
  "packages/rust/crates/xiuxian-wendao-parsers",
  "packages/rust/crates/xiuxian-wendao-episteme",
  "packages/rust/crates/xiuxian-wendao",
  "packages/rust/crates/xiuxian-wendao-builtin",
  "packages/rust/crates/xiuxian-wendao-core",
  "packages/rust/crates/xiuxian-wendao-runtime",
  "packages/rust/crates/xiuxian-wendao-sql",
  "packages/rust/crates/xiuxian-wendao-studio",
  "packages/rust/crates/xiuxian-wendao-server",
  "packages/rust/crates/xiuxian-lance",
  "packages/rust/crates/xiuxian-macros",
  "packages/rust/crates/xiuxian-memory-engine",
  "packages/rust/crates/xiuxian-logging",
  "packages/rust/crates/xiuxian-security",
  "packages/rust/crates/xiuxian-sandbox",
  "packages/rust/crates/xiuxian-code-intelligence",
  "packages/rust/crates/xiuxian-tokenizer",
  "packages/rust/crates/xiuxian-types",
  "packages/rust/crates/xiuxian-vector",
  "packages/rust/crates/xiuxian-db-store",
  "packages/rust/crates/xiuxian-qianhuan",
  "packages/rust/crates/xiuxian-qianji-bpmn-engine",
  "packages/rust/crates/xiuxian-llm",
  "packages/rust/crates/xiuxian-julia-core",
  "packages/rust/crates/xiuxian-julia-runtime",
  "packages/rust/crates/xiuxian-polyglot-orchestrator",
  "packages/rust/crates/xiuxian-wendao-client",
  "packages/rust/crates/xiuxian-window",
  "packages/rust/crates/xiuxian-qianji-control",
  "packages/rust/crates/xiuxian-qianji-runtime",
  "packages/rust/crates/xiuxian-qianji-client",
  "packages/rust/crates/xiuxian-qianji",
  "packages/rust/crates/xiuxian-zhixing",
  "packages/rust/crates/xiuxian-zhenfa",
]

# Workspace package metadata (inherited by all crates)
[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["CyberXiuXian Artisan workshop"]
license = "Apache-2.0"
publish = false
description = "CyberXiuXian Artisan Workshop - High-performance Agentic OS with Rust Core"

# Unified dependency management
[workspace.dependencies]
# Core dependencies
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0.100"
ariadne = "0.6.0"
thiserror = "2.0.17"
walkdir = "2.5.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4.38", default-features = false }
chrono-tz = "0.10.4"
tracing = "0.1"
tracing-log = "0.2"
globset = "0.4"
include_dir = "0.7.4"
rand = "0.8"
futures = "0.3.32"
foyer = { version = "0.22.3", default-features = false, features = ["runtime-tokio"] }
tokio-util = "0.7.18"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-postgres = "0.7"
flate2 = "1.1.9"
tar = "0.4.45"
md5 = "0.8.0"
regex = "1"
blake3 = "1"
inventory = "0.3"
comrak = { version = "0.50.0", default-features = false }
orgize = { git = "https://github.com/tao3k/orgize", rev = "1799417d88347cdc7caf8fd7a3b793ac838fc66c" }
pulldown-cmark = "0.12"
quick-xml = "0.39.2"
petgraph = "0.7"
async-trait = "0.1"
num-traits = "0.2"
url = "2.5.7"
tower = "0.5"
tower-http = "0.6"
proc-macro2 = "1"
syn = { version = "2.0", features = ["full"] }
quote = "1"
ast-grep-core = "0.40.5"
ast-grep-language = "0.40.5"
ast-grep-config = "0.40.5"
tera = "1"
aho-corasick = "1.1"
ignore = "0.4"
similar = "2.7"
unicode-normalization = "0.1"
xxhash-rust = "0.8"
tree-sitter = "0.26.5"
tree-sitter-python = "0.25.0"
graphql-parser = "0.4"
merman-core = "0.5.0"
image = "0.25"
imageproc = "0.25"
duckdb = { version = "=1.10502.0", default-features = false, features = ["bundled", "appender-arrow", "parquet"] }

# Git operations
gix = "0.81.0"

# Python bindings - Python 3.13 support via PyO3 0.27+
pyo3 = { version = "0.27.2", features = ["extension-module"] }
pyo3-build-config = "0.27.2"
pyo3-asyncio = { version = "0.27", features = ["tokio"] }

# Safe I/O & Tokenization
tiktoken-rs = "0.9.1"
memchr = "2.7.6"
tempfile = "3.24"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokenizers = "0.22.2"

# JSON Schema generation for Schema Singularity (SSOT)
schemars = "1.2.0"
jsonschema = "0.18.3"
specta = { version = "2.0.0-rc.23", features = ["derive"] }
specta-typescript = "0.0.10"

# LanceDB for vector storage
lance = { git = "https://github.com/lancedb/lance.git", rev = "ad05eae9e33eee8ef4f40b06f2843a907b6d6eb3", default-features = false }
lance-arrow = { git = "https://github.com/lancedb/lance.git", rev = "ad05eae9e33eee8ef4f40b06f2843a907b6d6eb3" }
lance-file = { git = "https://github.com/lancedb/lance.git", rev = "ad05eae9e33eee8ef4f40b06f2843a907b6d6eb3" }
lance-index = { git = "https://github.com/lancedb/lance.git", rev = "ad05eae9e33eee8ef4f40b06f2843a907b6d6eb3" }
lance-linalg = { git = "https://github.com/lancedb/lance.git", rev = "ad05eae9e33eee8ef4f40b06f2843a907b6d6eb3" }

# Arrow IPC for analytics and DataFusion execution
arrow = { version = "58", features = ["ffi"] }
arrow-array = { version = "58", features = ["ffi"] }
arrow-flight = { version = "58", features = ["flight-sql"] }
arrow-ipc = "58"
arrow-schema = { version = "58", features = ["ffi"] }
arrow-string = "58"
parquet = "58"
datafusion = "53.0.0"
sqlparser = "0.61.0"

# Redis cache and session backend
redis = { version = "1.0.3", default-features = false }

# Logging
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Parallel processing
rayon = "1.11"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
litellm-rs = { git = "https://github.com/majiayu000/litellm-rs", rev = "6937b32f1bf12db601f71520a966b43f6b82b0ef", default-features = false }

# CLI and HTTP
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tonic = { version = "0.14.5", default-features = false, features = ["transport"] }
tonic-web = "0.14"
prost = "0.14"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Testing utilities
insta = { version = "1.46.3", features = ["json", "redactions"] }
serial_test = { version = "3", features = ["file_locks"] }
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7.5"
rust-lang-project-harness = { git = "https://github.com/tao3k/rust-lang-project-harness", rev = "70e2cbfdaae59baa2149839b8678266820c4b604" }

# Performance optimization - Thin LTO for reduced memory
[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"


[workspace.lints.rust]
unsafe_code = "deny" # Default deny unsafe unless explicitly allowed
missing_docs = "warn" # Public APIs must have documentation

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny" # Deny unwrap usage in production
expect_used = "deny" # Deny expect usage in production
